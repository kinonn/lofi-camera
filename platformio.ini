[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; ---- Compile-time image processing -----------------------------------------
; Two independent switches; both default to the cheap option.
;
; 1) Viewfinder processing (src/preview.h):
;      PREVIEW_MODE_DITHER (default) - ordered dithering, cheapest
;      PREVIEW_MODE_CANNY            - Canny edge detection, ~48 KB more RAM
;
; 2) SD capture filter (src/jpeg_filter.h):
;      JPEG_FILTER_NONE (default)        - write the camera JPEG verbatim
;      JPEG_FILTER_WHITE_BORDER          - 20 px white border, inset into the
;                                          same canvas; costs ~1-2 s per shot
;
; Enable by uncommenting, either or both:
build_flags =
 -DJPEG_FILTER_SWAP565=1
 -DPREVIEW_MODE=PREVIEW_MODE_DITHER
 -DJPEG_FILTER=JPEG_FILTER_WHITE_BORDER

lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
