[env:esp32s3cam]
platform = espressif32
board = esp32-s3-devkitc-1
; The N8 board json only describes 8 MB QIO flash with no PSRAM; the CAM is
; an N8R8 (8 MB octal PSRAM), so select the OPI SDK variant explicitly.
board_build.arduino.memory_type = qio_opi
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; ---- Image processing ------------------------------------------------------
; Viewfinder processing stays compile-time (src/preview.h):
;   PREVIEW_MODE_FLOYD_STEINBERG (only supported firmware renderer)
;
; The SD capture filter is selected at runtime with the GPIO14 button:
; short press cycles None -> Kodachrome 64 -> T-Max 400 -> Portra 400;
; long press toggles the 24 px preserving white border. The selection is
; stored in NVS. Defaults live in src/jpeg_filter.h:
;   FILTER_DEFAULT_LOOK   FILTER_LOOK_TMAX
;   FILTER_DEFAULT_BORDER 0
; The look filters cost seconds per shot (see README); None is a zero-cost
; pass-through.
;
; -O3 replaces the platform's -Os: the capture filter is ~15% faster than -O2
; (look + sharpen, measured on the S3). build_unflags is needed because the
; platform appends -Os after build_flags, so -O3 alone would be overridden.
build_unflags = -Os
build_flags =
 -O3
 ; N8R8: the OPI SDK variant only enables the PSRAM drivers; this flag is what
 ; makes ps_malloc()/psramFound() real in the app. Without it SXGA allocation
 ; fails and the boot ladder silently drops to VGA.
 -DBOARD_HAS_PSRAM
 ; DBG() goes to the native USB-C CDC port, so logging owns no GPIO.
 -DARDUINO_USB_CDC_ON_BOOT=1
 -DPREVIEW_MODE=PREVIEW_MODE_FLOYD_STEINBERG
; TEMP diagnostic: per-stage ms to /timing.txt. Remove when tuning is done.
 -DCAPTURE_TIMING
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
