[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; ---- Compile-time image processing -----------------------------------------
; Two independent switches.
;
; 1) Viewfinder processing (src/preview.h):
;      PREVIEW_MODE_FLOYD_STEINBERG (only supported firmware renderer)
;
; 2) SD capture filter (src/jpeg_filter.h):
;      JPEG_FILTER_NONE                  - write the camera JPEG verbatim
;      JPEG_FILTER_WHITE_BORDER          - paint 20 px over frame edges;
;                                          costs ~1-2 s per shot
;      JPEG_FILTER_SUPERIA_USM (default) - Fuji Superia 400 look + unsharp
;                                          sharpen (preview_lab port);
;                                          costs ~14 s per shot
;
; The checked-in build uses Floyd-Steinberg and the SUPERIA_USM capture
; filter. JPEG_FILTER_SWAP565 only affects the WHITE_BORDER filter (one swap
; pass before fmt2jpg, which reads RGB565 input big-endian while the decoder
; writes little-endian); the SUPERIA filter always swaps pre-encode and
; ignores the flag. Change JPEG_FILTER in build_flags below to select another
; capture filter; SUPERIA_USM adds ~14 s per shot.
; -O2 replaces the platform's -Os: the capture filter is ~40% faster at -O2
; (sharpen, measured on the board). build_unflags is needed because the
; platform appends -Os after build_flags, so -O2 alone would be overridden.
build_unflags = -Os
build_flags =
 -O2
 -DJPEG_FILTER_SWAP565=1
 -DPREVIEW_MODE=PREVIEW_MODE_FLOYD_STEINBERG
 -DJPEG_FILTER=JPEG_FILTER_SUPERIA_USM

lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
