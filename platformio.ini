[env:esp32s3cam]
platform = espressif32
board = esp32-s3-devkitc-1
; The N8 board json only describes 8 MB QIO flash with no PSRAM; the CAM is
; an N8R8 (8 MB octal PSRAM), so select the OPI SDK variant explicitly.
board_build.arduino.memory_type = qio_opi
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; ---- Compile-time image processing -----------------------------------------
; Two independent switches.
;
; 1) Viewfinder processing (src/preview.h):
;      PREVIEW_MODE_FLOYD_STEINBERG (only supported firmware renderer)
;
; 2) SD capture filter (src/jpeg_filter.h):
;      JPEG_FILTER_NONE                  - write the camera JPEG verbatim
;      JPEG_FILTER_WHITE_BORDER          - paint 20 px over frame edges;
;                                          costs ~1-2 s per shot
;      JPEG_FILTER_SUPERIA_USM (default) - Fuji Superia 400 look + unsharp
;                                          sharpen (preview_lab port);
;                                          ~6.6 s per shot on the S3
;                                          (measured; see README)
;
; The checked-in build uses Floyd-Steinberg and the SUPERIA_USM capture
; filter. JPEG_FILTER_SWAP565 only affects the WHITE_BORDER filter (one swap
; pass before fmt2jpg, which reads RGB565 input big-endian while the decoder
; writes little-endian); the SUPERIA filter always swaps pre-encode and
; ignores the flag. Change JPEG_FILTER in build_flags below to select another
; capture filter; SUPERIA_USM takes seconds per shot (see README).
; -O3 replaces the platform's -Os: the capture filter is ~15% faster than -O2
; (look + sharpen, measured on the S3). build_unflags is needed because the
; platform appends -Os after build_flags, so -O3 alone would be overridden.
build_unflags = -Os
build_flags =
 -O3
 ; N8R8: the OPI SDK variant only enables the PSRAM drivers; this flag is what
 ; makes ps_malloc()/psramFound() real in the app. Without it SXGA allocation
 ; fails and the boot ladder silently drops to VGA.
 -DBOARD_HAS_PSRAM
 ; DBG() goes to the native USB-C CDC port, so logging owns no GPIO.
 -DARDUINO_USB_CDC_ON_BOOT=1
 -DJPEG_FILTER_SWAP565=1
 -DPREVIEW_MODE=PREVIEW_MODE_FLOYD_STEINBERG
 -DJPEG_FILTER=JPEG_FILTER_SUPERIA_USM
; TEMP diagnostic: per-stage ms to /timing.txt. Remove when tuning is done.
 -DCAPTURE_TIMING
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
